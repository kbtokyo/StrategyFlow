<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StrategyFlow | Agent</title>
  <style>
    :root {
      --bg: #07070f;
      --bg-card: #0d0d1a;
      --bg-msg-user: #12121f;
      --border: rgba(255,255,255,0.07);
      --border-hover: rgba(255,255,255,0.14);
      --text: #f0f0ff;
      --muted: #7070a0;
      --accent: #c9a84c;
      --accent-dim: rgba(201,168,76,0.12);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border);
      background: rgba(7,7,15,0.95);
      backdrop-filter: blur(12px);
      flex-shrink: 0;
      z-index: 10;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 500;
      padding: 0.4rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
      flex-shrink: 0;
    }

    .back-btn:hover {
      color: var(--text);
      border-color: var(--border-hover);
      background: rgba(255,255,255,0.03);
    }

    .agent-identity {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex: 1;
    }

    .agent-icon {
      font-size: 1.6rem;
      line-height: 1;
    }

    .agent-info {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
    }

    .agent-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent);
    }

    .agent-tagline {
      font-size: 0.77rem;
      color: var(--muted);
      font-style: italic;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #2ecc71;
      border-radius: 50%;
      margin-left: auto;
      flex-shrink: 0;
      box-shadow: 0 0 6px rgba(46,204,113,0.6);
    }

    /* ── MESSAGES AREA ── */
    .messages-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      scroll-behavior: smooth;
    }

    .messages-wrap::-webkit-scrollbar {
      width: 5px;
    }

    .messages-wrap::-webkit-scrollbar-track {
      background: transparent;
    }

    .messages-wrap::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.08);
      border-radius: 10px;
    }

    .messages-inner {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* ── WELCOME ── */
    .welcome {
      text-align: center;
      padding: 3rem 1rem;
      animation: fadeIn 0.5s ease both;
    }

    .welcome-icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
    }

    .welcome h2 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .welcome p {
      font-size: 0.92rem;
      color: var(--muted);
      max-width: 440px;
      margin: 0 auto;
      line-height: 1.7;
    }

    .welcome-starters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      justify-content: center;
      margin-top: 1.75rem;
    }

    .starter-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.8rem;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }

    .starter-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    /* ── MESSAGE BUBBLES ── */
    .msg {
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.3s ease both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      align-items: flex-end;
    }

    .msg.assistant {
      align-items: flex-start;
    }

    .msg-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
      padding: 0 0.25rem;
    }

    .msg.user .msg-label {
      color: var(--accent);
      opacity: 0.7;
    }

    .msg-bubble {
      max-width: 78%;
      padding: 0.9rem 1.25rem;
      border-radius: 16px;
      font-size: 0.92rem;
      line-height: 1.75;
      word-break: break-word;
    }

    .msg.user .msg-bubble {
      background: var(--bg-msg-user);
      border: 1px solid var(--border-hover);
      border-bottom-right-radius: 4px;
    }

    .msg.assistant .msg-bubble {
      background: transparent;
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--text);
    }

    /* ── TEXT FORMATTING ── */
    .msg-bubble p {
      margin-bottom: 0.75em;
    }

    .msg-bubble p:last-child {
      margin-bottom: 0;
    }

    .msg-bubble strong {
      color: var(--accent);
      font-weight: 600;
    }

    .msg-bubble em {
      opacity: 0.85;
    }

    .msg-bubble code {
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 0.85em;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 0.1em 0.4em;
      border-radius: 4px;
      color: #e8cc7a;
    }

    .msg-bubble pre {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 1rem;
      overflow-x: auto;
      margin: 0.75em 0;
    }

    .msg-bubble pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 0.82em;
      color: #c8e6c9;
    }

    .msg-bubble ul, .msg-bubble ol {
      padding-left: 1.4em;
      margin-bottom: 0.75em;
    }

    .msg-bubble li {
      margin-bottom: 0.3em;
    }

    .msg-bubble h1, .msg-bubble h2, .msg-bubble h3 {
      color: var(--accent);
      margin: 1em 0 0.4em;
      font-size: 1em;
      font-weight: 700;
    }

    .msg-bubble h1:first-child,
    .msg-bubble h2:first-child,
    .msg-bubble h3:first-child {
      margin-top: 0;
    }

    .msg-bubble hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 0.8em 0;
    }

    /* ── CURSOR ── */
    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--accent);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 0.85s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* ── THINKING INDICATOR ── */
    .thinking {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 0.82rem;
      color: var(--muted);
      max-width: 200px;
    }

    .thinking-dots {
      display: flex;
      gap: 4px;
    }

    .thinking-dots span {
      width: 5px;
      height: 5px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite;
    }

    .thinking-dots span:nth-child(1) { animation-delay: 0s; }
    .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
      40%            { transform: scale(1);   opacity: 1; }
    }

    /* ── INPUT AREA ── */
    .input-area {
      flex-shrink: 0;
      padding: 1.25rem 2rem 1.5rem;
      border-top: 1px solid var(--border);
      background: rgba(7,7,15,0.95);
    }

    .input-inner {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
    }

    .input-wrap {
      flex: 1;
      position: relative;
    }

    textarea {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.92rem;
      line-height: 1.6;
      padding: 0.85rem 1rem;
      resize: none;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      max-height: 180px;
      overflow-y: auto;
    }

    textarea::placeholder {
      color: var(--muted);
      opacity: 0.6;
    }

    textarea:focus {
      border-color: rgba(201,168,76,0.35);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.06);
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #07070f;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s, transform 0.15s;
    }

    .send-btn:hover:not(:disabled) {
      opacity: 0.85;
      transform: scale(1.05);
    }

    .send-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .input-hint {
      text-align: center;
      font-size: 0.7rem;
      color: var(--muted);
      opacity: 0.5;
      margin-top: 0.6rem;
    }

    /* ── ERROR MSG ── */
    .error-msg {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(231,76,60,0.08);
      border: 1px solid rgba(231,76,60,0.2);
      border-radius: 10px;
      padding: 0.7rem 1rem;
      font-size: 0.85rem;
      color: #e74c3c;
      max-width: 78%;
    }

    /* ── NOT FOUND ── */
    .not-found {
      text-align: center;
      padding: 5rem 2rem;
    }

    .not-found h2 {
      font-size: 1.4rem;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    .not-found a {
      color: var(--accent);
      text-decoration: none;
    }

    @media (max-width: 640px) {
      header { padding: 0.85rem 1rem; }
      .messages-wrap { padding: 1.25rem 1rem; }
      .input-area { padding: 1rem 1rem 1.25rem; }
      .msg-bubble { max-width: 92%; }
    }
  </style>
</head>
<body>

<header id="header">
  <a class="back-btn" href="/">&#8592; Back</a>
  <div class="agent-identity">
    <div class="agent-icon" id="agentIcon"></div>
    <div class="agent-info">
      <div class="agent-name" id="agentName">Loading…</div>
      <div class="agent-tagline" id="agentTagline"></div>
    </div>
  </div>
  <div class="status-dot" id="statusDot"></div>
</header>

<div class="messages-wrap" id="messagesWrap">
  <div class="messages-inner" id="messages"></div>
</div>

<div class="input-area">
  <div class="input-inner">
    <div class="input-wrap">
      <textarea
        id="inputBox"
        rows="1"
        placeholder="Ask anything…"
        autocomplete="off"
        spellcheck="true"
      ></textarea>
    </div>
    <button class="send-btn" id="sendBtn" disabled title="Send">
      &#9654;
    </button>
  </div>
  <p class="input-hint">Enter to send &nbsp;·&nbsp; Shift+Enter for new line</p>
</div>

<script>
  // ── AGENT DATA (mirrors app.py) ──
  const AGENT_META = {
    'strategy-advisor':    { icon: '🎯', name: 'Strategy Advisor',    tagline: 'Shape your competitive advantage', accent: '#c9a84c', starters: ['Walk me through a SWOT framework for my business', 'How do I assess a new market entry opportunity?', 'What competitive strategy should a challenger brand use?'] },
    'market-intelligence': { icon: '📊', name: 'Market Intelligence', tagline: 'See beyond the horizon',            accent: '#00b4d8', starters: ['How do I size an untapped market segment?', 'Analyze the competitive landscape in luxury aviation', 'What trends are reshaping the fintech industry?'] },
    'investment-analyst':  { icon: '💹', name: 'Investment Analyst',  tagline: 'Turn insight into alpha',           accent: '#2ecc71', starters: ['Walk me through a DCF valuation model', 'What are the key risks in an aviation ETF?', 'How do I evaluate a pre-revenue startup?'] },
    'operations-optimizer':{ icon: '⚙️', name: 'Operations Optimizer',tagline: 'Execute at peak performance',      accent: '#4a90e2', starters: ['How do I map and optimize a core business process?', 'Build a KPI dashboard framework for my operations', 'What does a scalable org structure look like?'] },
    'innovation-scout':    { icon: '🚀', name: 'Innovation Scout',    tagline: 'Pioneer the next frontier',         accent: '#9b59b6', starters: ['What emerging tech should I watch in the next 3 years?', 'How do I assess a technology\'s readiness level?', 'Map out the electric aviation innovation landscape'] },
  };

  // ── INIT ──
  const params = new URLSearchParams(window.location.search);
  const agentId = params.get('id') || '';
  const meta = AGENT_META[agentId];

  const messagesEl = document.getElementById('messages');
  const inputBox   = document.getElementById('inputBox');
  const sendBtn    = document.getElementById('sendBtn');
  const wrap       = document.getElementById('messagesWrap');

  let history = [];
  let streaming = false;

  if (!meta) {
    messagesEl.innerHTML = `
      <div class="not-found">
        <h2>Agent not found</h2>
        <p><a href="/">← Return to Agent App Factory</a></p>
      </div>`;
    inputBox.disabled = true;
  } else {
    // Apply accent color
    document.documentElement.style.setProperty('--accent', meta.accent);
    document.documentElement.style.setProperty('--accent-dim', hexToRgba(meta.accent, 0.12));
    document.title = `StrategyFlow | ${meta.name}`;
    document.getElementById('agentIcon').textContent   = meta.icon;
    document.getElementById('agentName').textContent   = meta.name;
    document.getElementById('agentTagline').textContent = meta.tagline;
    sendBtn.disabled = false;
    renderWelcome();
  }

  function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  // ── WELCOME SCREEN ──
  function renderWelcome() {
    const starters = meta.starters.map(s =>
      `<button class="starter-btn" onclick="sendStarter(this)">${s}</button>`
    ).join('');
    messagesEl.innerHTML = `
      <div class="welcome" id="welcome">
        <div class="welcome-icon">${meta.icon}</div>
        <h2>${meta.name}</h2>
        <p>${getDesc(agentId)}</p>
        <div class="welcome-starters">${starters}</div>
      </div>`;
  }

  function getDesc(id) {
    const descs = {
      'strategy-advisor':    'AI-powered strategic planning and business analysis for executives and founders.',
      'market-intelligence': 'Deep market research, trend analysis, and competitive intelligence for informed decisions.',
      'investment-analyst':  'Rigorous financial analysis and investment intelligence for sophisticated investors.',
      'operations-optimizer':'Streamline operations, eliminate inefficiencies, and build scalable systems.',
      'innovation-scout':    'Identify emerging technologies, disruptive innovations, and future-defining opportunities.',
    };
    return descs[id] || '';
  }

  function sendStarter(btn) {
    inputBox.value = btn.textContent;
    sendMessage();
  }

  // ── TEXTAREA AUTO-RESIZE ──
  inputBox.addEventListener('input', () => {
    inputBox.style.height = 'auto';
    inputBox.style.height = Math.min(inputBox.scrollHeight, 180) + 'px';
  });

  // ── KEYBOARD SHORTCUTS ──
  inputBox.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!streaming) sendMessage();
    }
  });

  sendBtn.addEventListener('click', () => {
    if (!streaming) sendMessage();
  });

  // ── SEND MESSAGE ──
  async function sendMessage() {
    const text = inputBox.value.trim();
    if (!text || streaming) return;

    // Remove welcome screen on first message
    const welcome = document.getElementById('welcome');
    if (welcome) welcome.remove();

    // Add user bubble
    appendMsg('user', text);
    history.push({ role: 'user', content: text });

    // Reset input
    inputBox.value = '';
    inputBox.style.height = 'auto';
    setSending(true);

    // Thinking indicator
    const thinkingEl = appendThinking();
    scrollToBottom();

    // Assistant bubble (will be filled by stream)
    let assistantEl = null;
    let rawContent = '';

    try {
      const res = await fetch(`/api/chat/${agentId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history }),
      });

      if (!res.ok) {
        throw new Error(`HTTP ${res.status}: ${res.statusText}`);
      }

      thinkingEl.remove();
      assistantEl = appendMsg('assistant', '', true); // empty bubble with cursor
      scrollToBottom();

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });

        // Process complete SSE lines
        const lines = buffer.split('\n');
        buffer = lines.pop(); // keep incomplete last line

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const jsonStr = line.slice(6).trim();
          if (!jsonStr) continue;

          let evt;
          try { evt = JSON.parse(jsonStr); } catch { continue; }

          if (evt.type === 'text') {
            rawContent += evt.content;
            updateAssistantBubble(assistantEl, rawContent, true);
            scrollToBottom();
          } else if (evt.type === 'done') {
            updateAssistantBubble(assistantEl, rawContent, false);
            history.push({ role: 'assistant', content: rawContent });
          } else if (evt.type === 'error') {
            updateAssistantBubble(assistantEl, '', false);
            appendError(assistantEl.parentElement, evt.content);
          }
        }
      }

    } catch (err) {
      thinkingEl.remove();
      if (assistantEl) {
        updateAssistantBubble(assistantEl, '', false);
        appendError(assistantEl.parentElement, err.message || 'An unexpected error occurred.');
      } else {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'msg assistant';
        appendError(msgDiv, err.message || 'An unexpected error occurred.');
        messagesEl.appendChild(msgDiv);
      }
    } finally {
      setSending(false);
      scrollToBottom();
      inputBox.focus();
    }
  }

  // ── DOM HELPERS ──
  function appendMsg(role, text, withCursor = false) {
    const msg = document.createElement('div');
    msg.className = `msg ${role}`;

    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = role === 'user' ? 'You' : meta.name;

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';

    if (role === 'user') {
      bubble.textContent = text;
    } else {
      if (withCursor) {
        bubble.innerHTML = '<span class="cursor"></span>';
      } else {
        bubble.innerHTML = formatMarkdown(text);
      }
    }

    msg.appendChild(label);
    msg.appendChild(bubble);
    messagesEl.appendChild(msg);
    return bubble;
  }

  function updateAssistantBubble(bubble, text, withCursor) {
    if (withCursor) {
      bubble.innerHTML = formatMarkdown(text) + '<span class="cursor"></span>';
    } else {
      bubble.innerHTML = formatMarkdown(text);
    }
  }

  function appendThinking() {
    const msg = document.createElement('div');
    msg.className = 'msg assistant';
    msg.innerHTML = `
      <div class="msg-label">${meta.name}</div>
      <div class="thinking">
        <div class="thinking-dots">
          <span></span><span></span><span></span>
        </div>
        Thinking…
      </div>`;
    messagesEl.appendChild(msg);
    return msg;
  }

  function appendError(container, message) {
    const err = document.createElement('div');
    err.className = 'error-msg';
    err.innerHTML = `⚠ ${escHtml(message)}`;
    container.appendChild(err);
  }

  // ── MARKDOWN FORMATTER ──
  function formatMarkdown(text) {
    if (!text) return '';

    // Escape HTML first
    let t = escHtml(text);

    // Code blocks (``` ... ```)
    t = t.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) =>
      `<pre><code>${code.trimEnd()}</code></pre>`
    );

    // Inline code
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>');

    // Headers
    t = t.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    t = t.replace(/^## (.+)$/gm,  '<h2>$1</h2>');
    t = t.replace(/^# (.+)$/gm,   '<h1>$1</h1>');

    // Bold and italic
    t = t.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
    t = t.replace(/\*\*(.+?)\*\*/g,     '<strong>$1</strong>');
    t = t.replace(/\*(.+?)\*/g,         '<em>$1</em>');

    // Horizontal rule
    t = t.replace(/^---+$/gm, '<hr>');

    // Unordered lists (group consecutive items)
    t = t.replace(/((?:^[•\-\*] .+\n?)+)/gm, match => {
      const items = match.trim().split('\n').map(l =>
        `<li>${l.replace(/^[•\-\*] /, '')}</li>`
      ).join('');
      return `<ul>${items}</ul>`;
    });

    // Ordered lists
    t = t.replace(/((?:^\d+\. .+\n?)+)/gm, match => {
      const items = match.trim().split('\n').map(l =>
        `<li>${l.replace(/^\d+\. /, '')}</li>`
      ).join('');
      return `<ol>${items}</ol>`;
    });

    // Paragraphs: wrap double-newline-separated blocks that aren't already HTML
    t = t.split(/\n\n+/).map(block => {
      block = block.trim();
      if (!block) return '';
      if (/^<(h[123]|ul|ol|pre|hr)/.test(block)) return block;
      return `<p>${block.replace(/\n/g, '<br>')}</p>`;
    }).join('\n');

    return t;
  }

  function escHtml(s) {
    return s
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── SCROLL ──
  function scrollToBottom() {
    wrap.scrollTop = wrap.scrollHeight;
  }

  // ── STREAMING STATE ──
  function setSending(active) {
    streaming = active;
    sendBtn.disabled = active;
    inputBox.disabled = active;
    if (!active) inputBox.disabled = false;
  }
</script>
</body>
</html>
